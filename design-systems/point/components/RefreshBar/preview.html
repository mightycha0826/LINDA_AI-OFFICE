<!-- @dsCard group="상태 화면" height=140 -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>RefreshBar</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block"></head>
<body>
<div style="position:relative;max-width:390px;margin:16px;border-radius:var(--radius-lg);overflow:hidden;background:var(--bg);box-shadow:var(--shadow-card)"><div class="pt-refresh" role="status" aria-label="새로고침 중"><span class="pt-refresh__bar" style="width:40%"></span></div><div class="pt-col"><div class="pt-task"><button type="button" class="pt-check" aria-pressed="false" aria-label="버튼과 입력창 그리기, 완료로 표시"><span class="pt-check__dot"><span class="material-symbols-rounded" aria-hidden="true">check</span></span></button><span class="pt-task__name">버튼과 입력창 그리기</span><span class="pt-badge pt-badge--primary"><span class="pt-badge__dot" aria-hidden="true"></span>오늘</span></div></div></div>
</body>
</html>
