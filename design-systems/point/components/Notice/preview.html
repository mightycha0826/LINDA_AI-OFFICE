<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Notice</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block"></head>
<body>
<div class="pt-col" style="max-width:480px"><div class="pt-notice pt-notice--warn" role="status"><span class="material-symbols-rounded" aria-hidden="true">warning</span><span class="pt-notice__text">마감이 지난 할 일 2개</span><a href="#" class="pt-notice__action">보기</a></div><div class="pt-notice" role="status"><span class="material-symbols-rounded" aria-hidden="true">info</span><span class="pt-notice__text" style="font-weight:400;font-size:14px">마감 전날 9시에 알립니다</span></div><div class="pt-notice pt-notice--danger" role="alert"><span class="material-symbols-rounded" aria-hidden="true">error</span><span class="pt-notice__text">연결이 끊겼어요</span><button type="button" class="pt-notice__action">다시 시도</button></div></div>
</body>
</html>
