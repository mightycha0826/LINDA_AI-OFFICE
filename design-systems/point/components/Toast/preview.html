<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Toast</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block"></head>
<body>
<div class="pt-col" style="align-items:flex-start"><div class="pt-toast" role="status"><span class="material-symbols-rounded" aria-hidden="true">check_circle</span><span class="pt-toast__text">저장했습니다</span><button type="button" class="pt-toast__action">되돌리기</button></div><div class="pt-toast pt-toast--danger" role="alert"><span class="material-symbols-rounded" aria-hidden="true">cloud_off</span><span class="pt-toast__text">새로고침 실패</span><button type="button" class="pt-toast__action">다시 시도</button></div></div>
