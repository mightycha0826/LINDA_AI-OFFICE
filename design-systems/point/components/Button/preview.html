<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Button</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block"></head>
<body>
<div class="pt-row" style="align-items:flex-start"><div class="pt-col" style="padding:0;align-items:flex-start"><button type="button" class="pt-btn pt-btn--primary"><span class="material-symbols-rounded" aria-hidden="true">add</span>추가</button><span class="pt-label-sm">기본</span></div><div class="pt-col" style="padding:0;align-items:flex-start"><button type="button" class="pt-btn pt-btn--primary is-hover"><span class="material-symbols-rounded" aria-hidden="true">add</span>추가</button><span class="pt-label-sm">호버</span></div><div class="pt-col" style="padding:0;align-items:flex-start"><button type="button" class="pt-btn pt-btn--primary is-active"><span class="material-symbols-rounded" aria-hidden="true">add</span>추가</button><span class="pt-label-sm">눌림</span></div><div class="pt-col" style="padding:0;align-items:flex-start"><button type="button" class="pt-btn pt-btn--primary is-focus"><span class="material-symbols-rounded" aria-hidden="true">add</span>추가</button><span class="pt-label-sm">포커스</span></div><div class="pt-col" style="padding:0;align-items:flex-start"><button type="button" class="pt-btn pt-btn--primary" disabled><span class="material-symbols-rounded" aria-hidden="true">add</span>추가</button><span class="pt-label-sm">비활성</span></div></div><div class="pt-row" style="align-items:flex-start"><div class="pt-col" style="padding:0;align-items:flex-start"><button type="button" class="pt-btn">취소</button><span class="pt-label-sm">기본</span></div><div class="pt-col" style="padding:0;align-items:flex-start"><button type="button" class="pt-btn is-hover">취소</button><span class="pt-label-sm">호버</span></div><div class="pt-col" style="padding:0;align-items:flex-start"><button type="button" class="pt-btn is-active">취소</button><span class="pt-label-sm">눌림</span></div><div class="pt-col" style="padding:0;align-items:flex-start"><button type="button" class="pt-btn is-focus">취소</button><span class="pt-label-sm">포커스</span></div><div class="pt-col" style="padding:0;align-items:flex-start"><button type="button" class="pt-btn" disabled>취소</button><span class="pt-label-sm">비활성</span></div></div><div class="pt-row" style="align-items:flex-start"><div class="pt-col" style="padding:0;align-items:flex-start"><button type="button" class="pt-btn pt-btn--danger"><span class="material-symbols-rounded" aria-hidden="true">delete</span>삭제</button><span class="pt-label-sm">기본</span></div><div class="pt-col" style="padding:0;align-items:flex-start"><button type="button" class="pt-btn pt-btn--danger is-hover"><span class="material-symbols-rounded" aria-hidden="true">delete</span>삭제</button><span class="pt-label-sm">호버</span></div><div class="pt-col" style="padding:0;align-items:flex-start"><button type="button" class="pt-btn pt-btn--danger is-active"><span class="material-symbols-rounded" aria-hidden="true">delete</span>삭제</button><span class="pt-label-sm">눌림</span></div><div class="pt-col" style="padding:0;align-items:flex-start"><button type="button" class="pt-btn pt-btn--danger is-focus"><span class="material-symbols-rounded" aria-hidden="true">delete</span>삭제</button><span class="pt-label-sm">포커스</span></div><div class="pt-col" style="padding:0;align-items:flex-start"><button type="button" class="pt-btn pt-btn--danger" disabled><span class="material-symbols-rounded" aria-hidden="true">delete</span>삭제</button><span class="pt-label-sm">비활성</span></div></div><div class="pt-row"><button type="button" class="pt-btn pt-btn--primary is-loading" aria-busy="true"><span class="material-symbols-rounded" aria-hidden="true">progress_activity</span>저장 중</button></div>
</body>
</html>
