<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>EmptyState</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block"></head>
<body>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr))"><div class="pt-empty" role="status"><div class="pt-empty__disc"><span class="material-symbols-rounded" aria-hidden="true">checklist</span></div><p class="pt-empty__title">할 일이 없어요</p><p class="pt-empty__text">아래 입력줄에 적으면 바로 추가돼요</p></div><div class="pt-empty pt-empty--loading" role="status"><div class="pt-empty__disc"><span class="material-symbols-rounded" aria-hidden="true">progress_activity</span></div><p class="pt-empty__title">불러오는 중</p><p class="pt-empty__text">잠시만 기다려 주세요</p></div><div class="pt-empty pt-empty--error" role="status"><div class="pt-empty__disc"><span class="material-symbols-rounded" aria-hidden="true">cloud_off</span></div><p class="pt-empty__title">불러오지 못했어요</p><p class="pt-empty__text">인터넷 연결을 확인해 주세요</p><button type="button" class="pt-btn"><span class="material-symbols-rounded" aria-hidden="true">refresh</span>다시 시도</button></div></div>
</body>
</html>
