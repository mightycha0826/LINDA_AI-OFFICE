<!-- @dsCard group="목록" height=330 -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>TaskRow</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block"></head>
<body>
<div class="pt-col" style="max-width:390px"><div class="pt-task"><button type="button" class="pt-check" aria-pressed="true" aria-label="색 토큰 정하기, 완료됨"><span class="pt-check__dot"><span class="material-symbols-rounded" aria-hidden="true">check</span></span></button><span class="pt-task__name">색 토큰 정하기</span><span class="pt-badge">완료</span></div><div class="pt-task"><button type="button" class="pt-check" aria-pressed="false" aria-label="버튼과 입력창 그리기, 완료로 표시"><span class="pt-check__dot"><span class="material-symbols-rounded" aria-hidden="true">check</span></span></button><span class="pt-task__name">버튼과 입력창 그리기</span><span class="pt-badge pt-badge--primary"><span class="pt-badge__dot" aria-hidden="true"></span>오늘</span></div><div class="pt-task"><button type="button" class="pt-check" aria-pressed="false" aria-label="아이콘 고르기, 완료로 표시"><span class="pt-check__dot"><span class="material-symbols-rounded" aria-hidden="true">check</span></span></button><span class="pt-task__name">아이콘 고르기</span><span class="pt-badge pt-badge--point"><span class="pt-badge__dot" aria-hidden="true"></span>내일 마감</span></div><div class="pt-task"><button type="button" class="pt-check" aria-pressed="false" aria-label="글꼴 파일 올리기, 완료로 표시"><span class="pt-check__dot"><span class="material-symbols-rounded" aria-hidden="true">check</span></span></button><span class="pt-task__name">글꼴 파일 올리기</span><span class="pt-badge pt-badge--danger"><span class="material-symbols-rounded" aria-hidden="true">error</span>지연</span></div><div class="pt-task"><button type="button" class="pt-check" aria-pressed="false" aria-label="모바일 화면 그리기, 완료로 표시"><span class="pt-check__dot"><span class="material-symbols-rounded" aria-hidden="true">check</span></span></button><span class="pt-task__name">모바일 화면 그리기</span><span class="pt-badge">금요일</span></div></div>
<script>document.querySelectorAll(".pt-check").forEach(function(b){b.addEventListener("click",function(){var on=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",on);});});</script>
</body>
</html>
