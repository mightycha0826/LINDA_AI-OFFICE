<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>WeekStrip</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block"></head>
<body>
<div class="pt-col" style="max-width:390px"><div class="pt-week"><button type="button" class="pt-day" aria-pressed="false" aria-label="10월 11일 일요일"><span class="pt-day__wd">일</span><span class="pt-day__n">11</span><span class="pt-day__dot" aria-hidden="true"></span></button><button type="button" class="pt-day has-task" aria-pressed="false" aria-label="10월 12일 월요일"><span class="pt-day__wd">월</span><span class="pt-day__n">12</span><span class="pt-day__dot" aria-hidden="true"></span></button><button type="button" class="pt-day has-task" aria-current="date" aria-pressed="false" aria-label="10월 13일 화요일, 오늘"><span class="pt-day__wd">화</span><span class="pt-day__n">13</span><span class="pt-day__dot" aria-hidden="true"></span></button><button type="button" class="pt-day has-task" aria-pressed="false" aria-label="10월 14일 수요일"><span class="pt-day__wd">수</span><span class="pt-day__n">14</span><span class="pt-day__dot" aria-hidden="true"></span></button><button type="button" class="pt-day has-task" aria-pressed="true" aria-label="10월 15일 목요일"><span class="pt-day__wd">목</span><span class="pt-day__n">15</span><span class="pt-day__dot" aria-hidden="true"></span></button><button type="button" class="pt-day has-task" aria-pressed="false" aria-label="10월 16일 금요일"><span class="pt-day__wd">금</span><span class="pt-day__n">16</span><span class="pt-day__dot" aria-hidden="true"></span></button><button type="button" class="pt-day" aria-pressed="false" aria-label="10월 17일 토요일"><span class="pt-day__wd">토</span><span class="pt-day__n">17</span><span class="pt-day__dot" aria-hidden="true"></span></button></div></div>
<script>document.querySelectorAll(".pt-day").forEach(function(b){b.addEventListener("click",function(){document.querySelectorAll(".pt-day").forEach(function(o){o.setAttribute("aria-pressed","false");});b.setAttribute("aria-pressed","true");});});</script>
</body>
</html>
