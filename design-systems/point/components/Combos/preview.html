<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Combos</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block"></head>
<body>
<div id="combos" class="pt-combos"></div>
<script>
(function () {
  var root = document.getElementById('combos');
  function render() {
    var mode = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    root.innerHTML = '';
    window.Point.COMBOS.forEach(function (c) {
      var card = document.createElement('div');
      card.className = 'pt-combo';
      card.innerHTML = '<div class="pt-combo__name">' + (c.index + 1) + ' · ' + c.name + '</div>' +
        '<div class="pt-task"><button type="button" class="pt-check" aria-pressed="true" aria-label="완료됨"><span class="pt-check__dot"><span class="material-symbols-rounded" aria-hidden="true">check</span></span></button><span class="pt-task__name">색 토큰 정하기</span></div>' +
        '<div class="pt-task"><button type="button" class="pt-check" aria-pressed="false" aria-label="완료로 표시"><span class="pt-check__dot"><span class="material-symbols-rounded" aria-hidden="true">check</span></span></button><span class="pt-task__name">아이콘 고르기</span><span class="pt-badge pt-badge--point"><span class="pt-badge__dot" aria-hidden="true"></span>내일</span></div>' +
        '<button type="button" class="pt-btn pt-btn--primary"><span class="material-symbols-rounded" aria-hidden="true">add</span>추가</button>';
      window.Point.apply(card, c.index, mode);
      root.appendChild(card);
    });
  }
  render();
  new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
})();
</script>
</body>
</html>
