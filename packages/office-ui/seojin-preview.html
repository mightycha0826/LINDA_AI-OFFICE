<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>백서진 · 모델 스튜디오</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8e9ee;color:#252733;font:14px system-ui,sans-serif}header{height:68px;padding:16px 24px;display:flex;align-items:center;gap:20px;background:#fafafa;border-bottom:1px solid #d7d8de}h1{font-size:18px;margin:0}small{color:#717582}main{display:grid;grid-template-columns:31% 69%;height:calc(100vh - 68px)}aside{padding:24px;background:#dce1e9;display:flex;flex-direction:column;gap:12px;min-height:0}aside img{width:100%;height:calc(100% - 40px);object-fit:contain;object-position:top}section{position:relative;min-width:0;min-height:0;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}.toolbar{position:absolute;left:20px;right:20px;bottom:20px;display:flex;gap:6px;flex-wrap:wrap;padding:10px;background:#ffffffed;border:1px solid #d7d8de;border-radius:12px}button{border:1px solid #c9cbd3;border-radius:6px;background:white;color:#333747;padding:8px 12px;cursor:pointer}button[aria-pressed=true]{background:#343747;color:white}#stats{position:absolute;left:24px;top:20px;color:#687080;font-size:12px;white-space:pre-line}.hint{margin-left:auto}@media(max-width:700px){main{grid-template-columns:35% 65%}aside{padding:8px}.toolbar{left:6px;right:6px;bottom:6px;gap:4px}button{padding:6px;font-size:11px}}
</style></head>
<body><header><h1>백서진 <small>비서실장</small></h1><small>REFERENCE / 3D STUDY</small><small class="hint">드래그로 회전 · 휠로 확대</small></header>
<main><aside><strong>기준 사진</strong><img src="/assets/portraits/chief-of-staff.webp" alt="백서진 기준 사진"/></aside><section><canvas id="model"></canvas><div id="stats"></div><div class="toolbar"><button data-angle="0">정면</button><button data-angle="35">¾</button><button data-angle="90">측면</button><button data-angle="180">뒷면</button><button id="portrait">얼굴</button><button id="body">전체</button><button id="animate" aria-pressed="false">동작</button><button id="legacy" aria-pressed="false">이전 모델</button></div></section></main>
<script type="module" src="/src/seojin-preview.ts"></script></body></html>
